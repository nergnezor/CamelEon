<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6fa8b4">
  <title>Camel Joe</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4ecd8; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 20px Georgia, serif; color: #3b2a1e; }
  </style>
</head>
<body>
  <div id="loading">Camel Joe is waking up…</div>
  <script type="module">
    import init from "./cameljon.js";
    init().finally(() => document.getElementById("loading")?.remove());
    // The game starts once the canvas exists; hide the message then too.
    new MutationObserver((_, obs) => {
      if (document.querySelector("canvas")) { document.getElementById("loading")?.remove(); obs.disconnect(); }
    }).observe(document.body, { childList: true });
  </script>
</body>
</html>
