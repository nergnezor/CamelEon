[package]
name = "cameljon"
version = "0.1.0"
edition = "2024"

[features]
# Hot-patch code while the game runs with `dx serve --hotpatch`. On by default
# (native only); it does nothing unless the game was started by dx.
default = ["hotpatch"]
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[dependencies]
gilrs = "0.11.2"
glam = "0.33.10"
vello = "0.10.0"
web-time = "1.1.0"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
dioxus-devtools = { version = "0.7.10", optional = true }
pollster = "1.0.1"
subsecond = { version = "0.7.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window"] }

# Dev builds: optimise dependencies (vello, wgpu, …) but keep our own crate
# unoptimised, so hot-patching (`dx serve --hotpatch`) can swap functions
# that would otherwise be inlined.
[profile.dev.package."*"]
opt-level = 3

# Our own crate: light optimisation keeps the watercolour maths fast enough
# while inlining stays minimal, so hot-patches still reach most functions.
[profile.dev]
opt-level = 1
